name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pexpect (지속 셸 세션 테스트용)
        run: pip install pexpect
      - name: 전체 테스트
        run: python3 tests/run_all.py
      - name: 컴파일 체크
        run: python3 -m py_compile src/htb_agent/*.py src/htb_agent/*/*.py

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true   # 정보용 — 테스트 잡이 게이트
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: ruff (비차단)
        run: pip install ruff && ruff check src/ || true
      - name: mypy (비차단)
        run: pip install mypy && mypy src/ --ignore-missing-imports --no-error-summary || true
